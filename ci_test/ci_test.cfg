# ci_test 运行时配置（分级配置体系的基线）
#
# 读取顺序：当前工作目录的 ci_test.cfg（优先，同名项覆盖本文件） -> 本文件（基线）
# 本文件随仓库提交，作为全局基线；项目级 ci_test.cfg 由用户本地维护，已被 .gitignore 忽略。
# 写操作（--root / 构建告警统计 / --cj-home）始终写入当前目录的 ci_test.cfg，不会修改本文件。
# 注意：configparser 不支持行尾注释，注释必须单独占一行。

[test-home]
# 测试目录
dir = ../../test

[running]
# 临时运行目录
temp_dir = ../test_temp/run

[logging]
# 日志目录
name = ../test_temp/log
# 日志级别
level = INFO
# 命令日志输出方式: simple=折叠冗长参数, full=全量打印
# 命令行 --log-cmd 优先于此配置
log_cmd = simple

[test]
# HLT/bench 三方库根目录（workspace：项目根目录的上一级）
# 默认值与历史配置一致；本机路径不同时请在项目级 ci_test.cfg 中覆盖
3rd_party_root = /home/lyq/workspace
# OHOS HLT 三方库根目录（--target=ohos 时使用）
# 留空不会自动回退，OHOS 场景请显式填写
3rd_party_root_ohos =
# fuzz 库
fuzz_lib =
# fuzz 运行次数
fuzz_runs =
# fuzz 内存限制（MB）
fuzz_rss_limit_mb =
# HLT 编译时需要新增的编译选项
compile_options = --test -Woff all --dy-std
# 运行时选项
run_options = --no-progress
# 运行时堆大小
CJHEAPSIZE = 1GB

[cangjie-home]
# 以下路径留空时由脚本自动探测
OHOS_compile_option =
DEVECO_CANGJIE_HOME =
OHOS_ROOT =
OHOS_version =
# 仓颉环境目录
home = /home/lyq/cangjie_env
# cjpm 管理的 git 目录
cjpm =
# 是否修改 cjpm.toml 文件
update_toml = true

[git-config]
# 拉取仓库使用的账号密码
username =
password =

[build-warning]
# 构建告警阈值
warning = 0
